[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spyc"
version = "0.1.0"
description = "Terminal viewer for browsing code bases: syntax colors, git history and coverage"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Adam Waldenberg, Adeptum AB", email = "info@adeptum.se" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
    "tree-sitter>=0.25",
    "pygments>=2.19",
    "defusedxml>=0.7",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-kotlin",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-scss",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-xml",
    "tree-sitter-yaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist"]

[project.scripts]
spyc = "spyc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spyc.syntax" = ["queries/**/*.scm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
